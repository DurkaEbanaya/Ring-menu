        <use href="#open" x="-128" y="-43"/><text x="-128" y="-18">Открыть</text>
        <use href="#copy" x="-94" y="-103"/><text x="-94" y="-78">Копировать</text>
        <g color="#0078d4" fill="#0065ad"><use href="#cut" x="-35" y="-140"/><text x="-35" y="-115">Вырезать</text></g>
