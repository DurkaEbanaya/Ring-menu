      <text y="118" text-anchor="middle" font-size="14" fill="#697580">Палец не перекрывает команды</text>
    </g>
    <g transform="translate(990 340)">
      <rect width="396" height="300" fill="#fcfcfc" stroke="#c7d0d8" filter="url(#shadow)"/>
      <use href="#file" x="33" y="33"/><text x="65" y="28" font-size="17" font-weight="600">Фото.jpg</text><text x="65" y="50" font-size="13" fill="#697580">Выбран 1 файл</text>
      <path d="M0 70H396 M132 70V300 M264 70V300 M0 185H396" fill="none" stroke="#e1e6eb"/>
      <rect x="133" y="71" width="130" height="113" fill="#dfedf9" stroke="#0078d4"/>
      <g text-anchor="middle" font-size="14" color="#35434e">
        <use href="#open" x="66" y="113"/><text x="66" y="151">Открыть</text>
        <g color="#0078d4" fill="#0065ad"><use href="#copy" x="198" y="113"/><text x="198" y="151">Копировать</text></g>
        <use href="#cut" x="330" y="113"/><text x="330" y="151">Вырезать</text>
        <use href="#rename" x="66" y="230"/><text x="66" y="268">Переимен.</text>
        <use href="#trash" x="198" y="230"/><text x="198" y="268">В корзину</text>
        <use href="#more" x="330" y="230"/><text x="330" y="268">Ещё…</text>
      </g>
      <text x="198" y="345" text-anchor="middle" font-size="14" fill="#697580">Крупные цели, читаемые подписи</text>
