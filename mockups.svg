    <g font-size="16"><text x="36" y="755">+ Быстрый выбор по направлению</text><text x="504" y="755">+ Свободная область над пальцем</text><text x="972" y="755">+ Проще попасть и прочитать</text></g>
    <g font-size="14" fill="#697580"><text x="36" y="782">− Нужно место вокруг точки вызова</text><text x="504" y="782">− Нужна адаптация у верхнего края</text><text x="972" y="782">− Менее выразительное взаимодействие</text></g>
    <path d="M36 814H1404" stroke="#d3dbe2"/>
    <text x="36" y="847" font-size="17">«Ещё…» → полное штатное меню　 ·　 Касание снаружи → закрыть</text>
    <text x="36" y="878" font-size="13" fill="#77838e">Визуальные эскизы, не работающий интерфейс. Подсветка условная. Размеры и возможности Nilesoft ещё предстоит проверить.</text>
